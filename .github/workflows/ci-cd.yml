
name: Bookinfo CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.filter.outputs.changes }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            details:
              - 'details/**'
              - '.github/workflows/ci-cd.yml'

            productpage:
              - 'productpage/**'
              - '.github/workflows/ci-cd.yml'

            ratings:
              - 'ratings/**'
              - '.github/workflows/ci-cd.yml'

            reviews:
              - 'reviews/**'
              - '.github/workflows/ci-cd.yml'

      - name: Display changed services
        run: |
          echo 'Changed services: ${{ steps.filter.outputs.changes }}'
