
name: Bookinfo CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.filter.outputs.changes }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            details:
              - 'details/**'
              - '.github/workflows/ci-cd.yml'

            productpage:
              - 'productpage/**'
              - '.github/workflows/ci-cd.yml'

            ratings:
              - 'ratings/**'
              - '.github/workflows/ci-cd.yml'

            reviews:
              - 'reviews/**'
              - '.github/workflows/ci-cd.yml'

      - name: Display changed services
        run: |
          echo 'Changed services: ${{ steps.filter.outputs.changes }}'

  test-ratings:
    name: Test Ratings Service
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.services), 'ratings')
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: ratings

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Check JavaScript syntax
        run: node --check ratings.js

  test-productpage:
    name: Test Productpage Service
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.services), 'productpage')
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: productpage

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install application dependencies
        run: pip install -r requirements.txt

      - name: Install test dependencies
        run: pip install -r test-requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests/unit

  test-details:
    name: Test Details Service
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.services), 'details')
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: details

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: details

      - name: Check Ruby syntax
        run: |
          find . -type f -name '*.rb' \
            -not -path './vendor/*' \
            -exec ruby -c {} \;

  test-reviews:
    name: Test Reviews Service
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.services), 'reviews')
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: Build and test Reviews
        working-directory: reviews
        run: gradle build --no-daemon

  sast:
    name: SAST - Semgrep
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep SAST
        run: |
          semgrep scan \
            --config p/default \
            --severity ERROR \
            --error \
            details productpage ratings reviews

  secret-scan:
    name: Secret Scanning - Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: Dependency Scanning - Trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Trivy dependency scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
