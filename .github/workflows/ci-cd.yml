
name: Bookinfo CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.filter.outputs.changes }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            details:
              - 'details/**'
              - '.github/workflows/ci-cd.yml'

            productpage:
              - 'productpage/**'
              - '.github/workflows/ci-cd.yml'

            ratings:
              - 'ratings/**'
              - '.github/workflows/ci-cd.yml'

            reviews:
              - 'reviews/**'
              - '.github/workflows/ci-cd.yml'

      - name: Display changed services
        run: |
          echo 'Changed services: ${{ steps.filter.outputs.changes }}'

  sast:
    name: SAST - Semgrep
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep SAST
        run: |
          semgrep scan \
            --config p/default \
            --severity ERROR \
            --error \
            details productpage ratings reviews

  secret-scan:
    name: Secret Scanning - Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: Dependency Scanning - Trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Trivy dependency scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  docker-build-scan:
    name: Docker Build & Scan - ${{ matrix.service }}
    needs:
      - changes
      - sast
      - secret-scan
      - dependency-scan

    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.sast.result == 'success' &&
      needs.secret-scan.result == 'success' &&
      needs.dependency-scan.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.changes.outputs.services != '[]'

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: bookinfo-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: bookinfo-${{ matrix.service }}:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SERVICE: ${{ matrix.service }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}-${SERVICE}"

          docker tag "bookinfo-${SERVICE}:ci" "${IMAGE}:${SHA}"
          docker tag "bookinfo-${SERVICE}:ci" "${IMAGE}:latest"

          docker push "${IMAGE}:${SHA}"
          docker push "${IMAGE}:latest"

          echo "Published ${IMAGE}:${SHA}" >> "$GITHUB_STEP_SUMMARY"
